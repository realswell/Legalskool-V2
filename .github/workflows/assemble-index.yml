name: Assemble index.html

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Decode payload into index.html
        run: |
          set -euo pipefail
          missing=0
          for i in $(seq -w 0 30); do
            f=".payload/b${i}.b64"
            if [ ! -f "$f" ]; then
              echo "missing $f"
              missing=1
            fi
          done
          test "$missing" -eq 0
          : > /tmp/index.b64
          for i in $(seq -w 0 30); do
            tr -d '\n\r ' < ".payload/b${i}.b64" >> /tmp/index.b64
          done
          base64 -d /tmp/index.b64 > index.html
          bytes=$(wc -c < index.html)
          echo "index.html bytes: $bytes"
          test "$bytes" -eq 455844
          echo "bae9e4af43da4c266608769619d8e43d028be10be00f15e7ebf38e62b1ffca83  index.html" | sha256sum -c -
          grep -q 'provider=google&apikey=' index.html
          head -c 15 index.html | grep -q '<!DOCTYPE html>'

      - name: Commit assembled index.html
        run: |
          set -euo pipefail
          git config user.name "realswell"
          git config user.email "322542834+realswell@users.noreply.github.com"
          git add index.html
          git rm -r --ignore-unmatch .payload
          git commit -m "Add production index.html (Google authorize URL includes apikey)"
          git push origin HEAD:main
